name: Build IPA

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      runtime_urls:
        description: "Optional: iOS Java runtime archive URL(s) to embed (space-separated, URL#sha256=... allowed)"
        required: false
        default: ""
      lwjgl_urls:
        description: "Optional: iOS LWJGL natives archive URL(s)"
        required: false
        default: ""
      renderer_urls:
        description: "Optional: GL renderer archive URL(s) with renderer.json"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    name: Compile & package IPA (iOS arm64)
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ZMF_RUNTIME_URLS: ${{ github.event.inputs.runtime_urls || vars.ZMF_RUNTIME_URLS }}
      ZMF_LWJGL_URLS: ${{ github.event.inputs.lwjgl_urls || vars.ZMF_LWJGL_URLS }}
      ZMF_RENDERER_URLS: ${{ github.event.inputs.renderer_urls || vars.ZMF_RENDERER_URLS }}
      HAS_SIGNING: ${{ secrets.IOS_CERT_P12_BASE64 != '' && secrets.IOS_PROFILE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "IPA_NAME=ZMFJavaLauncher-v${VERSION}.ipa" >> "$GITHUB_ENV"
            echo "IS_TAG=true" >> "$GITHUB_ENV"
          else
            VERSION="$(awk -F'"' '/MARKETING_VERSION/{print $2; exit}' project.yml)"
            # Stable file name for the rolling build so existing download links keep working.
            echo "IPA_NAME=ZMFJavaLauncher-v0.1.ipa" >> "$GITHUB_ENV"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building version $VERSION (build $GITHUB_RUN_NUMBER)"

      - name: Select newest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build Java support jar and JNI headers
        run: |
          mkdir -p build
          ./scripts/prepare-jni-headers.sh
          ./scripts/build-java-support.sh
          # Prove the bytecode we ship is valid by running it on the host JVM.
          java -cp App/Resources/java/zmf-support.jar dev.zmf.support.Bootstrap dev.zmf.support.SelfTest build/host-selftest.json
          cat build/host-selftest.json

      - name: Fetch optional runtime components
        run: ./scripts/fetch-components.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Compile for iOS device (arm64, unsigned)
        run: |
          set -o pipefail
          # Repository variables override project.yml defaults only when set.
          EXTRA=()
          [ -n "${{ vars.ZMF_MSA_CLIENT_ID }}" ] && EXTRA+=("ZMF_MSA_CLIENT_ID=${{ vars.ZMF_MSA_CLIENT_ID }}")
          [ -n "${{ vars.ZMF_VOICE_RELAY_URL }}" ] && EXTRA+=("ZMF_VOICE_RELAY_URL=${{ vars.ZMF_VOICE_RELAY_URL }}")
          xcodebuild \
            -project ZMFJavaLauncher.xcodeproj \
            -scheme ZMFJavaLauncher \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            "${EXTRA[@]}" \
            build 2>&1 | tee build/xcodebuild.log | grep -E "error:|warning: .*(Swift|deprecated)|BUILD (SUCCEEDED|FAILED)|\*\*" || true
          grep -q "BUILD SUCCEEDED" build/xcodebuild.log || { grep -E "error:" build/xcodebuild.log | head -80; exit 1; }

      - name: Package IPA
        run: ./scripts/package-ipa.sh build/DerivedData/Build/Products/Release-iphoneos/ZMFJavaLauncher.app "$IPA_NAME"

      - name: Sign IPA (only when signing secrets are configured)
        if: env.HAS_SIGNING == 'true'
        env:
          IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: ./scripts/sign-ipa.sh "$IPA_NAME" "${IPA_NAME%.ipa}-signed.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZMFJavaLauncher-ipa
          path: ZMFJavaLauncher-*.ipa
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/xcodebuild.log
            build/host-selftest.json
          if-no-files-found: ignore

      - name: Checksums and AltStore/SideStore source
        if: github.event_name != 'pull_request'
        run: |
          REPO_URL="https://github.com/$GITHUB_REPOSITORY"
          TAG="${IS_TAG:+$GITHUB_REF_NAME}"; TAG="${TAG:-latest-build}"
          ICON="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/App/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"
          PRE=prerelease
          if [ "$IS_TAG" = true ] && [[ "$VERSION" != *-* ]]; then PRE=""; fi
          python3 scripts/make-altstore-source.py altstore-source.json "$VERSION" "$IPA_NAME" \
            "$REPO_URL/releases/download/$TAG/$IPA_NAME" "$REPO_URL" "$ICON" $PRE
          shasum -a 256 ZMFJavaLauncher-*.ipa > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish versioned release (tags v*)
        if: env.IS_TAG == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAGS=""
          [[ "$VERSION" == *-* ]] && FLAGS="--prerelease"
          gh release create "$GITHUB_REF_NAME" ZMFJavaLauncher-*.ipa SHA256SUMS.txt altstore-source.json \
            $FLAGS --verify-tag --title "ZMF Java Launcher $VERSION" --notes-file docs/RELEASE_NOTES.md

      - name: Publish rolling "latest-build" pre-release (direct Safari download)
        if: github.event_name != 'pull_request' && env.IS_TAG != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build ZMFJavaLauncher-*.ipa SHA256SUMS.txt altstore-source.json \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "ZMF Java Launcher $VERSION — latest build" \
            --notes "Automated build of ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}. Unsigned IPA: sign with Signulous, AltStore or SideStore (see docs/INSTALL.md). Current status: docs/STATUS.md."

  tests:
    name: Unit tests (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE/Contents/Developer"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare
        run: |
          brew install xcodegen
          ./scripts/prepare-jni-headers.sh
          ./scripts/build-java-support.sh
          xcodegen generate
      - name: Java telemetry tests (mapping resolution, vanilla + Fabric)
        run: ./scripts/test-java.sh
      - name: Run tests
        run: |
          set -o pipefail
          mkdir -p build
          UDID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')"
          echo "Simulator: $UDID"
          xcodebuild test \
            -project ZMFJavaLauncher.xcodeproj \
            -scheme ZMFJavaLauncher \
            -destination "id=$UDID" \
            -derivedDataPath build/TestData \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/test.log | grep -E "Test Case|error:|Executed|\*\*" || true
          grep -q "TEST SUCCEEDED" build/test.log || { grep -E "error:|failed" build/test.log | head -80; exit 1; }
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: build/test.log
          if-no-files-found: ignore
