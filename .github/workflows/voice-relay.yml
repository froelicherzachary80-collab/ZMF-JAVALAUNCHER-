name: Voice relay

on:
  push:
    branches: ["**"]
    paths: ["voice-relay/**", ".github/workflows/voice-relay.yml"]
  pull_request:
    paths: ["voice-relay/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-and-image:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voice-relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Unit + end-to-end tests
        run: npm test
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push image
        if: github.event_name != 'pull_request'
        run: |
          IMAGE="ghcr.io/$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')/zmf-voice-relay"
          docker build -t "$IMAGE:latest" -t "$IMAGE:${GITHUB_SHA::7}" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA::7}"
          echo "Pushed $IMAGE:latest" >> "$GITHUB_STEP_SUMMARY"
