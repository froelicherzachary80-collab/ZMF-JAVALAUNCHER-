name: ZMFJavaLauncher
options:
  bundleIdPrefix: dev.zmf
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_BITCODE: NO
    CLANG_ENABLE_OBJC_ARC: YES
    GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "GLES_SILENCE_DEPRECATION=1"]
    # Overridden from CI with the repository variable of the same name.
    ZMF_MSA_CLIENT_ID: ""
    ZMF_VOICE_RELAY_URL: ""

targets:
  ZMFGLFW:
    type: framework
    platform: iOS
    sources:
      - path: Native/ZMFGLFW/src
      - path: Native/ZMFGLFW/include
        buildPhase: headers
        headerVisibility: public
    settings:
      base:
        PRODUCT_NAME: ZMFGLFW
        PRODUCT_BUNDLE_IDENTIFIER: dev.zmf.javalauncher.glfw
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: NO
        SKIP_INSTALL: YES
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/Native/ZMFGLFW/include"]
        OTHER_LDFLAGS: ["-framework", "OpenGLES", "-framework", "QuartzCore", "-framework", "UIKit"]
        # Every exported glfw* symbol must stay visible so LWJGL can dlsym it.
        GCC_SYMBOLS_PRIVATE_EXTERN: NO
        DEAD_CODE_STRIPPING: NO

  ZMFJavaLauncher:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources/Assets.xcassets
      - path: App/Resources/java
        type: folder
        buildPhase: resources
    dependencies:
      - target: ZMFGLFW
        embed: true
      - sdk: OpenGLES.framework
      - sdk: GameController.framework
      - sdk: AuthenticationServices.framework
      - sdk: Network.framework
      - sdk: AVFoundation.framework
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ZMF Java
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: true
        UIStatusBarHidden: false
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportsDocumentBrowser: false
        GCSupportsControllerUserInteraction: true
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
        NSLocalNetworkUsageDescription: ZMF Java connects to Minecraft Java Edition servers on your local network when you add them by address.
        CFBundleURLTypes:
          - CFBundleURLName: dev.zmf.javalauncher.auth
            CFBundleURLSchemes: [zmflauncher]
        ZMFMSAClientID: "$(ZMF_MSA_CLIENT_ID)"
        ZMFVoiceRelayURL: "$(ZMF_VOICE_RELAY_URL)"
        NSMicrophoneUsageDescription: ZMF Voice uses the microphone so players near you in Minecraft (and in your voice rooms) can hear you. Audio is only sent while you talk.
        UIBackgroundModes: [audio]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.modrinth.mrpack
            UTTypeDescription: Modrinth Modpack
            UTTypeConformsTo: [public.zip-archive]
            UTTypeTagSpecification:
              public.filename-extension: [mrpack]
          - UTTypeIdentifier: com.sun.java-archive
            UTTypeDescription: Java Archive
            UTTypeConformsTo: [public.zip-archive]
            UTTypeTagSpecification:
              public.filename-extension: [jar]
    settings:
      base:
        PRODUCT_NAME: ZMFJavaLauncher
        PRODUCT_BUNDLE_IDENTIFIER: dev.zmf.javalauncher
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_OBJC_BRIDGING_HEADER: App/Sources/Bridge/ZMFJavaLauncher-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Native/ZMFGLFW/include"
          - "$(SRCROOT)/Native/Generated/jni"
        CODE_SIGN_ENTITLEMENTS: App/ZMFJavaLauncher.entitlements
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/Frameworks"]
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Embed optional native runtime components
        script: |
          "${SRCROOT}/scripts/embed-components.sh"
        basedOnDependencyAnalysis: false

  ZMFJavaLauncherTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/ZMFJavaLauncherTests
        excludes: ["Fixtures/**"]
      - path: Tests/ZMFJavaLauncherTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: ZMFJavaLauncher
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.zmf.javalauncher.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ZMFJavaLauncher.app/ZMFJavaLauncher"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  ZMFJavaLauncher:
    build:
      targets:
        ZMFJavaLauncher: all
        ZMFJavaLauncherTests: [test]
    test:
      targets:
        - ZMFJavaLauncherTests
